<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Sabbir Dewan, Front-End Developer">
  <title>Sabbir Dewan, Front-End Developer</title>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="0.45" stop-color="#3A0A16"/>
      <stop offset="0.75" stop-color="#800020"/>
      <stop offset="1" stop-color="#0A0A0A"/>
    </linearGradient>
    <linearGradient id="hfade" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.07" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.93" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C0264A" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#800020" stop-opacity="0"/>
    </radialGradient>
    <mask id="fade" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="300">
      <rect width="1200" height="300" fill="url(#hfade)"/>
    </mask>
    <mask id="shape" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="300">
      <g class="edge">
        <path d="M-600 46 Q-450 30 -300 46 T0 46 T300 46 T600 46 T900 46 T1200 46 T1500 46 T1800 46 T2100 46 T2400 46 L2400 254 Q2250 238 2100 254 T1800 254 T1500 254 T1200 254 T900 254 T600 254 T300 254 T0 254 T-300 254 T-600 254 Z" fill="#fff" />
      </g>
    </mask>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <style>
    .edge { animation: drift 14s linear infinite; }
    .w1 { animation: drift 11s linear infinite; }
    .w2 { animation: driftr 17s linear infinite; }
    .w3 { animation: drift 23s linear infinite; }
    @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-600px); } }
    @keyframes driftr { from { transform: translateX(-600px); } to { transform: translateX(0); } }
    .glow { animation: breathe 6s ease-in-out infinite; transform-origin: 600px 150px; }
    @keyframes breathe { 0%,100% { opacity: .55; transform: scale(.92); } 50% { opacity: 1; transform: scale(1.08); } }
    .t { opacity: 0; animation: up 1.2s ease-out forwards; }
    .t2 { animation-delay: .35s; } .t3 { animation-delay: .7s; }
    @keyframes up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .ln { transform-origin: 600px 168px; transform: scaleX(0); animation: grow 1.2s ease-out .5s forwards; }
    @keyframes grow { to { transform: scaleX(1); } }
  </style>

  <g mask="url(#fade)">
    <g mask="url(#shape)">
      <rect width="1200" height="300" fill="url(#base)"/>
      <g class="w1"><path d="M-600 176 Q-450 154 -300 176 T0 176 T300 176 T600 176 T900 176 T1200 176 T1500 176 T1800 176 T2100 176 T2400 176 L2400 300 Q2250 300 2100 300 T1800 300 T1500 300 T1200 300 T900 300 T600 300 T300 300 T0 300 T-300 300 T-600 300 Z" fill="#800020" fill-opacity="0.45"/></g>
      <g class="w2"><path d="M-600 204 Q-450 186 -300 204 T0 204 T300 204 T600 204 T900 204 T1200 204 T1500 204 T1800 204 T2100 204 T2400 204 L2400 300 Q2250 300 2100 300 T1800 300 T1500 300 T1200 300 T900 300 T600 300 T300 300 T0 300 T-300 300 T-600 300 Z" fill="#A8183A" fill-opacity="0.28"/></g>
      <g class="w3"><path d="M-600 232 Q-450 218 -300 232 T0 232 T300 232 T600 232 T900 232 T1200 232 T1500 232 T1800 232 T2100 232 T2400 232 L2400 300 Q2250 300 2100 300 T1800 300 T1500 300 T1200 300 T900 300 T600 300 T300 300 T0 300 T-300 300 T-600 300 Z" fill="#050505" fill-opacity="0.7"/></g>
      <ellipse class="glow" cx="600" cy="150" rx="420" ry="90" fill="url(#glow)"/>
    </g>
  </g>

  <g text-anchor="middle">
    <text class="t" x="600" y="146" font-family="Georgia, 'Times New Roman', serif" font-size="70" fill="#FFFFFF">Sabbir Dewan</text>
    <line class="ln" x1="500" y1="168" x2="700" y2="168" stroke="#D9A0AF" stroke-width="1.4"/>
    <text class="t t2" x="600" y="204" font-family="'Helvetica Neue', Arial, sans-serif" font-size="19" letter-spacing="8" fill="#E8C3CC">FRONT-END DEVELOPER</text>
    <text class="t t3" x="600" y="232" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="4" fill="#C98A9A">DHAKA, BANGLADESH</text>
  </g>
</svg>
